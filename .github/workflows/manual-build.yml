name: Manual Docker Build and Push
# 手动触发：仅构建并推送镜像，不涉及版本发布
# 依赖 Secrets（与 deploy.yml 一致）:
# - DOCKER_USERNAME
# - DOCKER_PASSWORD
# - DOCKER_REGISTRY_HOST
# - DOCKER_REGISTRY_NAMESPACE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空则使用 git 短 SHA）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_HOST }}/${{ secrets.DOCKER_REGISTRY_NAMESPACE }}/kexie-at-web:${{ steps.tag.outputs.value }}
            ${{ secrets.DOCKER_REGISTRY_HOST }}/${{ secrets.DOCKER_REGISTRY_NAMESPACE }}/kexie-at-web:latest
          provenance: false
          sbom: false
